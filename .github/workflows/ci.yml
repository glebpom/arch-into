name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  RUST_BACKTRACE: 1

jobs:
  ci-pass:
    name: CI is green
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - style
      - clippy
      - test
      - nightly
      - docs
    steps:
      - name: Require every validation job to succeed
        env:
          NEEDS_RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'length > 0 and all(. == "success")' <<< "$NEEDS_RESULTS"

  style:
    name: Check Style

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          profile: minimal
          override: true

      - name: cargo fmt -- --check
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: -- --check

  clippy:
    name: Check Clippy

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy
          profile: minimal
          override: true

      - name: cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings

  test:
    name: linux / ${{ matrix.rust }}
    needs: [style]

    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust:
          - stable
          - beta
        target:
          - wasm32-unknown-unknown

    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          profile: minimal
          override: true

      - name: Install 32-bit runtime test target
        run: rustup target add i686-unknown-linux-musl

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build

      - name: Test
        uses: actions-rs/cargo@v1
        with:
          command: test

      - name: Test 64-bit conversions
        run: cargo test --features no-arch-32

      - name: Test on a 32-bit target
        run: cargo test --target=i686-unknown-linux-musl

      - name: Test 32-bit conversions
        run: cargo test --target=i686-unknown-linux-musl --features no-arch-64

      - name: Check tests on a 32-bit target
        run: cargo check --tests --target=wasm32-unknown-unknown

      - name: Check 32-bit conversion tests
        run: cargo check --tests --target=wasm32-unknown-unknown --features no-arch-64

      - name: arch-32 - 64bit target - should fail
        shell: bash
        run: |
          if cargo check
          then
            exit 1
          else
            exit 0
          fi
        working-directory: examples/arch-32

      - name: arch-64 - 32bit target - should fail
        shell: bash
        run: |
          if cargo check --target=wasm32-unknown-unknown
          then
            exit 1
          else
            exit 0
          fi
        working-directory: examples/arch-64

      - name: arch-32-64 - 64bit target
        run: cargo check
        working-directory: examples/arch-32-64

      - name: arch-64 - 64bit target
        run: cargo check
        working-directory: examples/arch-64

      - name: arch-32 - 32bit target
        run: cargo check --target=wasm32-unknown-unknown
        working-directory: examples/arch-32

      - name: arch-32-64 - 32bit target
        run: cargo check --target=wasm32-unknown-unknown
        working-directory: examples/arch-32-64


  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        uses: actions-rs/cargo@v1
        with:
          command: doc
          args: --no-deps --document-private-items

  # Separate build job for nightly because of the missing feature for allowed failures at
  # job level. See `jobs.build.strategy.matrix`.
  nightly:
    name: linux / nightly
    needs: [style]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          override: true

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build

      - name: Test
        uses: actions-rs/cargo@v1
        with:
          command: test
